name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/whatsmeow/go.mod
          cache-dependency-path: apps/server/whatsmeow/go.sum
      - run: pnpm install --frozen-lockfile
      - run: go test ./...
        working-directory: apps/server/whatsmeow
      - run: go vet ./...
        working-directory: apps/server/whatsmeow
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
